<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="sketch.css">
<style>
  body { --accent: #14B8A6; }
  .title { font-size: 52px; }
  .badge { position:absolute; font-family:"Marker Felt","Chalkboard SE",cursive; font-size:22px; color:var(--accent); z-index:3; }
  .phead { position:absolute; font-family:"Marker Felt","Chalkboard SE",cursive; font-size:24px; color:var(--ink); z-index:3; }
  .pcap  { position:absolute; font-size:21px; color:var(--gray); line-height:1.3; z-index:3; }
  .pcap b { color:var(--ink); font-weight:normal; }
  .screen { padding:12px 16px; }
  .screen .label { font-size:22px; }
  .screen .sub { font-size:17px; }
  .cardtop { justify-content:flex-start; padding-top:12px; }
  .mono { font-family:"Courier New",monospace; font-size:15px; letter-spacing:-0.3px; line-height:1.4; }
  .storycap { position:absolute; font-family:"Marker Felt","Chalkboard SE",cursive; font-size:27px; color:var(--ink); text-align:center; width:100%; left:0; z-index:3; }
  .storycap .em { color:var(--accent); }
</style>
</head>
<body>
  <div class="title" style="left:56px; top:34px;">the bill you cut with proof</div>
  <div class="subtitle" style="left:60px; top:100px;">cutting telemetry costs blindly is scary. so prove the fix is safe first. &mdash; TELELENS</div>

<script src="sketch.js"></script>
<script src="character.js"></script>
<script src="story-builder.js"></script>
<script>
window.addEventListener("load", () => {
  Sketch.init();
  Sketch.underline(".title");
  const S = Story, A = S.getAccent();

  // ---- panel 1: the bill winces -----------------------------------------
  S.frame(0); S.badge(0, 1);
  S.headline(0, "the bill");
  const sc1 = S.screen(0, '<div class="label red-ink" style="margin-top:2px;">storage: $39/mo</div><div class="sub" style="color:var(--gray)">&hellip; and climbing</div>', 54, 240, 120, "cardtop", "var(--red)");
  S.character(0, "frustrated", { cy: 404 });
  S.caption(0, "the storage bill<br><b>lands on your desk.</b>");

  // ---- panel 2: one scan ranks ------------------------------------------
  S.frame(1); S.badge(1, 2);
  S.headline(1, "one scan");
  const sc2 = S.screen(1, '<div class="mono" style="text-align:left; width:100%;"><span style="color:var(--gray)">$</span> telelens scan<br><span style="color:var(--red)">F-001 crit</span> logs&nbsp;&nbsp;37GB<br><span style="color:var(--accent)">F-002 high</span> attrs&nbsp;27GB<br><span style="color:var(--accent)">F-006 crit</span> label 12GB</div>', 50, 256, 132, "cardtop");
  S.character(1, "focused", { cy: 406 });
  S.caption(1, "one command<br><b>ranks the waste.</b>");

  // ---- panel 3: proven safe ---------------------------------------------
  S.frame(2); S.badge(2, 3);
  S.headline(2, "proven safe first");
  const sc3 = S.screen(2, '<div class="mono" style="text-align:left; width:100%;">errors kept: <b>40 / 40</b><br>slow kept:&nbsp;&nbsp;<b>55 / 55</b></div>', 50, 250, 132, "cardtop");
  S.character(2, "relieved", { cy: 406, noSymbol: true });
  S.caption(2, "a valve keeps <b>every error</b><br>&mdash; verdict: <b>SAFE.</b>");

  // ---- panel 4: the bill drops ------------------------------------------
  S.frame(3); S.badge(3, 4);
  S.headline(3, "the bill drops");
  const sc4 = S.screen(3, '<div class="mono" style="text-align:left; width:100%; color:var(--gray);">span storage</div>', 50, 250, 132, "cardtop");
  S.character(3, "happy", { cy: 406 });
  S.caption(3, "&minus;95% storage<br><b>measured, not projected.</b>");

  // ---- decorative drawings ----------------------------------------------
  // panel 3: a funnel/valve keeping errors (accent), boring drops through
  (function valve(s){
    const cx = s.cx, ty = s.top + 84;
    Sketch.line(cx-40, ty, cx-12, ty+26, { color:A, width:2.6, jit:0.7, seed:700 });
    Sketch.line(cx+40, ty, cx+12, ty+26, { color:A, width:2.6, jit:0.7, seed:701 });
    Sketch.line(cx-12, ty+26, cx+12, ty+26, { color:A, width:2.4, jit:0.5, seed:702 });
    // errors retained (accent dots inside) vs boring dropping out (gray, below)
    [-20,-4,12].forEach((dx,i)=> Sketch.circle(cx+dx, ty+8, 4, { color:A, width:2, fill:A, seed:710+i }));
    [0,16].forEach((dx,i)=> Sketch.circle(cx-4+dx, ty+44, 3.5, { color:"var(--gray)", width:1.8, seed:720+i, opacity:0.7 }));
  })(sc3);
  // panel 4: two bars, big -> tiny, with -95%
  (function bars(s){
    const baseY = s.top + 120, x1 = s.left + 42, x2 = s.left + s.w - 66, bw = 30;
    Sketch.line(x1, baseY, x1, baseY-62, { color:"var(--gray)", width:bw, jit:0.4, seed:730, opacity:0.5 });
    Sketch.line(x2, baseY, x2, baseY-4, { color:A, width:bw, jit:0.4, seed:731 });
    Sketch.arrow(x1+22, baseY-56, x2-22, baseY-7, { color:A, width:2.4, curve:16, seed:732, head:12 });
    S.el("mono", "&minus;95%", `position:absolute; left:${s.cx+2}px; top:${baseY-54}px; width:80px; color:var(--accent); font-size:19px; z-index:3;`);
  })(sc4);

  // ---- sequence arrows ---------------------------------------------------
  [0,1,2].forEach(i => S.seqArrow(i, 452));

  // ---- story caption arc ------------------------------------------------
  S.el("storycap",
    'waste found, fix generated, and proven safe &mdash; <span class="em">measured, not projected.</span>',
    'top:690px;');

  window.__sketchDone = true;
});
</script>
</body>
</html>
