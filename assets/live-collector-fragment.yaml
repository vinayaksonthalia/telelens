# Generated by telelens — review, then merge into your collector config.
# Apply via Foundry: see casting-patch.yaml next to this file.
# Profilers are read-only; nothing is applied until YOU run `foundryctl cast`.
processors:
  # F-001: 7801417 near-identical success spans are prime tail-sampling candidates (saves ~9.7 GB/mo ≈ $2.90/mo)
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    policies:
      - name: keep-errors            # F-001: never sampled away
        type: status_code
        status_code: { status_codes: [ERROR] }
      - name: keep-slow              # F-001: latency outliers always kept
        type: latency
        latency: { threshold_ms: 750 }
      - name: sample-boring-successes # F-001
        type: probabilistic
        probabilistic: { sampling_percentage: 5 }
  transform/defuse_label_bombs:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          # F-024: Unbounded ID "session.id" is a metric label on browser.sessions.count (saves ~n/a (directional))
          - delete_key(attributes, "session.id") where metric.name == "browser.sessions.count"
  filter/drop_unread_metrics:
    error_mode: ignore
    metrics:
      exclude:
        match_type: strict
        metric_names:
          - system.cpu.time  # F-003: saves ~0.3 GB/mo ≈ $0.08/mo
          - http.client.request.duration.bucket  # F-003
