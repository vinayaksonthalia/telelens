spec:
  ingester:
    config:
      data:
        # Generated by telelens — review, then merge into your collector config.
        # Apply via Foundry: see casting-patch.yaml next to this file.
        # Profilers are read-only; nothing is applied until YOU run `foundryctl cast`.
        processors:
          # F-002: 1400000 near-identical success spans are prime tail-sampling candidates (saves ~38.0 GB/mo ≈ $11.40/mo)
          tail_sampling:
            decision_wait: 10s
            num_traces: 50000
            policies:
              - name: keep-errors            # F-002: never sampled away
                type: status_code
                status_code: { status_codes: [ERROR] }
              - name: keep-slow              # F-002: latency outliers always kept
                type: latency
                latency: { threshold_ms: 750 }
              - name: sample-boring-successes # F-002
                type: probabilistic
                probabilistic: { sampling_percentage: 5 }
          # F-001: DEBUG-log firehose from catalog is 43% of your log volume (saves ~61.0 GB/mo ≈ $18.30/mo)
          filter/logs_catalog_below_info:
            error_mode: ignore
            logs:
              log_record:
                - 'resource.attributes["service.name"] == "catalog" and severity_number < SEVERITY_NUMBER_INFO'
          transform/span_attribute_diet:
            error_mode: ignore
            trace_statements:
              - context: span
                statements:
                  # F-005: Span attribute "session.id" has 450000 distinct values (saves ~0.6 GB/mo ≈ $0.18/mo)
                  - delete_key(attributes, "session.id")
                  # F-003: Jumbo attribute catalog.db.statement averages 4200 bytes per span (saves ~27.0 GB/mo ≈ $8.10/mo)
                  - set(attributes["db.statement"], Substring(attributes["db.statement"], 0, 256)) where Len(attributes["db.statement"]) > 256
          transform/defuse_label_bombs:
            error_mode: ignore
            metric_statements:
              - context: datapoint
                statements:
                  # F-004: Label "user_id" on "http_server_duration" explodes it to 210000 series (saves ~12.0 GB/mo ≈ $3.60/mo)
                  - delete_key(attributes, "user_id") where metric.name == "http_server_duration"
          # ──────────────────────────────────────────────────────────────────
          # REVIEW BEFORE ENABLING — this block is deliberately commented out.
          # "Unread" means: referenced by no SigNoz dashboard or alert rule.
          # telelens cannot see external consumers (federated Prometheus,
          # other pipelines). Verify each metric really has no reader, delete
          # the lines you must keep, then uncomment the block.
